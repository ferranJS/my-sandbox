<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>❤ css & js stuff ❤</title>
    <link rel="stylesheet" href="global.css" />
    <style>
        .flexible-container {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: baseline;
            gap: 4px;
            flex-wrap: nowrap;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a24;
        }
        .texto {
            white-space: nowrap;
            opacity: 0;
            width: 0;
            overflow: hidden;
            transition: 1.5s;
            font-size: 26px;
            color: #c0c0d0;
        }
        .letra {
            font-size: 26px;
            white-space: pre;
            color: #6c9fff;
            font-weight: bold;
        }
        .container:hover .texto {
            max-width: fit-content;
            width: 100%;
            opacity: 1;
            transition: 2.9s;
        }
        .title-group {
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const data = [
            { abrev: "ESAT", text: "Escuela Superior de Arte y Tecnología" },
            { abrev: "CIIP", text: "Campus Internacional Inteligencia Pericia" },
            { abrev: "UPV", text: "Universitat Politècnica de València" },
            { abrev: "HTML", text: "HyperText Markup Language" },
            { abrev: "CSS", text: "Cascading Style Sheets" },
            { abrev: "JS", text: "JavaScript" },
        ];

        const root = document.getElementById('root');

        data.forEach(item => {
            const container = document.createElement('div');
            container.className = 'container title-group';

            const flexContainer = document.createElement('div');
            flexContainer.className = 'flexible-container';

            const words = item.text.split(' ');
            let ai = 0;

            words.forEach(word => {
                const letter = item.abrev.charAt(ai);
                if (letter && letter.toUpperCase() === word.charAt(0).toUpperCase()) {
                    const letterLabel = document.createElement('label');
                    letterLabel.className = 'letra';
                    letterLabel.textContent = letter;
                    flexContainer.appendChild(letterLabel);

                    const textLabel = document.createElement('label');
                    textLabel.className = 'texto';
                    textLabel.textContent = word.substring(1);
                    flexContainer.appendChild(textLabel);

                    ai++;
                } else {
                    const textLabel = document.createElement('label');
                    textLabel.className = 'texto';
                    textLabel.textContent = ' ' + word;
                    flexContainer.appendChild(textLabel);
                }
            });

            container.appendChild(flexContainer);
            root.appendChild(container);
        });
    </script>
</body>
</html>
