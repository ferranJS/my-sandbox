<!DOCTYPE html>
<html>

<head>
	<meta charset=UTF-8 />
	<meta http-equiv="Expires" content="0">
	<meta http-equiv="Last-Modified" content="0">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta name="apple-mobile-web-app-capable" content="yes">
	<!-- ??? -->
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1, user-scalable=0">

	<link rel="stylesheet" type="text/css" href="styles.css" />

	<!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> -->
	<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
		integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous" />

	<!-- <script type="text/javascript" src="paintBucket.js"></script> -->
	<script type="text/javascript" src="mediaRecorder.js"></script>
	<script type="text/javascript" src="lines.js"></script>
	<script type="text/javascript" src="circles.js"></script>
	<script type="text/javascript" src="main.js"></script>

	<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" data-auto-a11y="true"></script> -->
</head>

<body style="background:rgb(61, 63, 70)">
	<div style="position:absolute;top:14px;left:22px;z-index:900000;pointer-events:none">p r o t o t i p o !</div>
	<div id="media-container">
		<!-- https://css-tricks.com/what-does-playsinline-mean-in-web-video/ -->
		<video id="video_in" class="hidden_video" controls autoplay muted loop playsinline>
			<source src="video.mp4" type="video/mp4">
		</video>
		<video id="video_out" class="hidden_video" controls autoplay muted loop>
			<!-- <label style="position:absolute;top:200px"> video result </label> -->
		</video>

		<div id="canvas-container">
			<canvas id="output-canvas" class="canvas" style="position:absolute;top:0;left:0"></canvas>
			<canvas id="temp-canvas" class="canvas" style="position:absolute;z-index:5;top:0;left:0;opacity:0"></canvas>
			<canvas id="nodes-canvas" class="canvas" style="position:absolute;z-index:3;top:0;left:0;opacity:0"></canvas>

			<div id="tweeks">
				<input id="slider" type="range" min="2" max="10" step="0.03" value=6>
				<div id="colorPicker-container">
					<input id="colorPicker" type="color" name="head" value="#ffe5e5">
				</div>
				<input id="modoLineas" type="radio" name="modo" onclick="selectMode('lines')" checked>
				<label for="modoLineas" class="radio">
					<i class="fa fa-slash" aria-hidden="true"></i>
				</label>
				<input id="modoPintar" type="radio" name="modo" onclick="selectMode('paint')">
				<label for="modoPintar" class="radio">
					<i class="fa fa-pencil" aria-hidden="true"></i>
				</label>
				<input id="modoCirculos" type="radio" name="modo" onclick="selectMode('circles')">
				<label for="modoCirculos" class="radio">
					<i class="far fa-circle" aria-hidden="true"></i>
				</label>
				<input id="modoGrab" type="radio" name="modo" onclick="modo = 'grab'">
				<!-- <label for="modoGrab" class="radio disabled">
					<i class="fa fa-eraser" aria-hidden="true"></i>
				</label> -->
				<!-- 
				<input id="modoBorrar" type="radio" name="modo" onclick="selectMode('borrar')" disabled>
				<label for="modoBorrar" class="radio disabled">
					<i class="fa fa-eraser" aria-hidden="true"></i>
				</label> -->
				<input id="videoRecord" type="checkbox">
				<label for="videoRecord" class="radio">
					<i class="fa fa-compact-disc" aria-hidden="true"></i>
				</label>
				<button onclick="undo()">
					<i class="fa fa-undo" aria-hidden="true"></i>
				</button>
				
				<button onclick="clearCanvas()">
					<i class="fa fa-trash" aria-hidden="true"></i>
				</button>
				<!-- <div style="width:20px;height:60px;"></div> -->
				<button onclick="next()" style="height:80px;display:block">
					<p style="white-space:pre" id="nextTxt">Controles
del vídeo </p> <br>
					<i class="fa fa-arrow-right" aria-hidden="true"></i>
				</button>
				<button id="goFS"><i class="fa fa-expand" aria-hidden="true"></i></button>
				<script>
					var goFS = document.getElementById("goFS");
					goFS.addEventListener("click", function() {
						if(document.fullscreenElement)
							document.exitFullscreen()
						else
							document.body.requestFullscreen();
					}, false);
				</script>
			</div>
		</div>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", () => {
			init()
		})
	</script>
</body>

</html>
